version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - BUILD_CPUS=${BUILD_CPUS:-2}
        - BUILD_HEAP_MB=${BUILD_HEAP_MB:-1536}
    container_name: bvl-intelligence-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./public/cdn:/app/public/cdn
      - ./public/uploads:/app/public/uploads
      # AppSheet customer photos / ID scans: private, served only via /api/media after login
      - ../vizione-private/appsheet:/app/storage/appsheet:ro
    env_file:
      - .env.local
